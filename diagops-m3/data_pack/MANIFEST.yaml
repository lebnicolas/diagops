name: diagops_data_pack
status: in_progress
distribution: learner_pack
generation_scripts_distributed: false
synthetic_data: true
current_release: diagops-2026-S1-m3-v1

periods:
  - id: "2026-S1"
    module_min: "M0"
    description: "Periode initiale mise a disposition progressivement."
  - id: "2026-S2"
    module_min: "M5"
    description: "Periode supplementaire pour evaluation operationnelle."
  - id: "2027-S1"
    module_min: "M6"
    description: "Periode supplementaire pour boucle de feedback."

files:
  - path: "2026-S1/reports/reports.jsonl"
    entity: "reports"
    module_min: "M0"
    required: true
    expected_rows: 40
    delivery_status: ready_for_distribution
    quality_review: schema_rules_and_semantic_scenario_review_v2
    scope: "M0 reports only; M1 evaluation inputs are released with annotations."

  - path: "2026-S1/annotations/diagops_train.jsonl"
    entity: "annotated_diagnostics"
    module_min: "M1"
    required: true
    expected_rows: 400
    delivery_status: ready_for_distribution
    quality_review: schema_rules_and_semantic_scenario_review_v2

  - path: "2026-S1/annotations/diagops_test.jsonl"
    entity: "annotated_diagnostics"
    module_min: "M1"
    required: true
    expected_rows: 100
    delivery_status: ready_for_distribution
    quality_review: schema_rules_and_semantic_scenario_review_v2
    semantic_holdout: true

  - path: "2026-S1/equipment/equipment.csv"
    entity: "equipment"
    module_min: "M2"
    required: true
    expected_rows: 420
    delivery_status: ready_for_distribution
    quality_review: schema_semantic_and_pedagogical_anomaly_review_v1

  - path: "2026-S1/sensors/sensor_readings.csv"
    entity: "sensors"
    module_min: "M3"
    required: true
    expected_rows: 50401
    delivery_status: ready_for_distribution
    quality_review: timeseries_schema_and_pedagogical_anomaly_review_v1
    nominal_step_hours: 6
    instrumented_equipment: 36
    scope: "M3 sensor series; partial park coverage is intentional."

  - path: "2026-S1/maintenance/maintenance_history.csv"
    entity: "maintenance_history"
    module_min: "M2"
    required: true
    expected_rows: 1800
    delivery_status: ready_for_distribution
    quality_review: schema_semantic_and_pedagogical_anomaly_review_v1

  - path: "2026-S1/events/events.csv"
    entity: "events"
    module_min: "M2"
    required: true
    expected_rows: 520
    delivery_status: ready_for_distribution
    quality_review: schema_semantic_and_pedagogical_anomaly_review_v1

  - path: "2026-S1/reference_runs/m1_for_m2/"
    entity: "m1_reference_run"
    module_min: "M2"
    required: true
    delivery_status: ready_for_distribution
    quality_review: continuity_pack_checksums_and_scope_review_v1
    scope: "Common M1 reference used to start M2 independently of personal M1 completion."

  - path: "2026-S1/reference_runs/m2_for_m3/"
    entity: "m2_reference_preparation"
    module_min: "M3"
    required: true
    delivery_status: ready_for_distribution
    quality_review: continuity_pack_checksums_and_scope_review_v1
    scope: "Common M2 prepared tables, quarantine and rule registry used to start M3 independently of personal M2 completion."

  - path: "2026-S1/m2_candidate_release/"
    entity: "m2_candidate_release"
    module_min: "M2"
    required: false
    delivery_status: ready_for_distribution
    quality_review: controlled_candidate_release_and_trainer_oracle_v1
    release_id: diagops-2026-S1-m2-candidate-r2
    scope: "Optional 14-hour M2 extension: qualify a new delivery without opening M3 sensor data."

  - path: "2026-S2/sensors/sensor_readings.csv"
    entity: "sensors"
    module_min: "M5"
    required: true

  - path: "2026-S2/events/events.csv"
    entity: "events"
    module_min: "M5"
    required: true

  - path: "2027-S1/reports/reports.jsonl"
    entity: "reports"
    module_min: "M6"
    required: true

  - path: "2027-S1/feedback/feedback.csv"
    entity: "feedback"
    module_min: "M6"
    required: true

  - path: "images/manifest.csv"
    entity: "images"
    module_min: "M7"
    required: true
    source: "external_corpus_to_be_selected"

integrity:
  checksums_file: "checksums.sha256"
  freeze_required_before_distribution: true

notes:
  - "The learner pack contains data only, not generation scripts."
  - "No anonymized exercise output is distributed."
  - "The M1 annotated subset is an input dataset, not a correction key."
  - "M2 opens equipment, events and maintenance history; sensors remain closed until M3."
  - "M3 opens the 2026-S1 sensor series; the instrumented park is a deliberate subset of equipment.csv."
  - "The sensor table has no declared row identifier: the logical key must be rebuilt during M3."
  - "The M2 to M3 reference preparation is a starting point, not a correction of the M2 brief."
  - "M2 tables intentionally contain controlled pedagogical anomalies documented only in the trainer area."
  - "The optional M2 candidate release is intentionally unqualified; its presence does not authorize integration into the published tables."
