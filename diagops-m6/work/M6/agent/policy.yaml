# Politique d'execution de l'agent borne M6.
# Toute modification est une decision documentee : elle change le comportement
# mesure, donc elle se compare a la reference avant promotion.
#
# Chaque valeur ci-dessous est justifiee par une mesure, pas par une intuition :
# voir docs/politique_execution.md et results/sensibilite_politique.json
# (banc : python eval/probe_policy.py).
schema_version: 1
policy_id: m6-r2
role: technicien

# Liste blanche : un outil absent d'ici est refuse, meme s'il est enregistre.
# Cout mesure du retrait de chacun, sur le jeu gele de 18 scenarios :
#   sans diagnose_report        0.833 -> 0.667   (3 refus incorrects)
#   sans get_equipment          0.833 -> 0.667   (2)
#   sans search_knowledge       0.833 -> 0.667   (2)
#   sans list_events            0.833 -> 0.722   (1)
#   sans get_maintenance_history 0.833 -> 0.778  (1)
# Aucune autorisation n'est gratuite : les cinq outils sont exerces par le jeu.
allowlist:
  - search_knowledge
  - get_equipment
  - list_events
  - get_maintenance_history
  - diagnose_report

budget:
  # Plancher impose par le jeu gele : SCN-006 exige 3 outils, et la borne est
  # testee AVANT de savoir si l'agent voulait s'arreter — un plan de N outils
  # demande donc N+1. Mesure : a max_steps=1, la reussite tombe a 0.444 avec
  # 9 refus incorrects et 14 depassements, sur des scenarios nominaux a un seul
  # outil que l'agent avait pourtant traites.
  # Entre 2 et 8, aucune difference mesurable aujourd'hui : l'agent fourni ne
  # fait qu'une etape. La valeur se redefendra a l'etape 5, agent enchainant.
  max_steps: 4
  # Redondant avec max_steps dans l'implementation actuelle : les deux sont
  # testes sur le meme compteur (len(run.steps)), donc le minimum gouverne.
  # Conserve egal pour que la distinction reste possible le jour ou une etape
  # pourra ne pas appeler d'outil.
  max_tool_calls: 4
  # Au moins la somme des timeouts du plan le plus long, sinon la politique
  # rend impossible un comportement legitime : SCN-006 = diagnose_report 1000
  # + get_equipment 800 + search_knowledge 1500 = 3300 ms. 8000 laisse x2.4.
  # Mesure locale : pire scenario 0.4 ms, mediane 0.03 ms — la borne ne mord
  # pas et ne doit pas mordre : elle protege d'une source distante degradee,
  # pas du fonctionnement nominal.
  max_duration_ms: 8000
  # Porte sur l'empreinte {outil + arguments}, pas sur l'outil : deux appels du
  # meme outil sur des arguments differents ne sont pas une repetition. 1
  # interdit donc le rappel strictement identique — la boucle couteuse d'ADV-004
  # — sans empecher un plan legitime. Inerte sur le jeu actuel (agent a une
  # etape), a re-mesurer a l'etape 5.
  max_repeated_calls: 1
  # Plafond de la politique, applique en plus de la limite propre a chaque
  # outil. Mesure de l'exposition sur le jeu gele : 1 -> 11 lignes lues,
  # 3 -> 23, 5 -> 26, 10 -> 26, et la reussite reste 0.833 dans les quatre cas.
  # Ce parametre ne gouverne pas la performance, il gouverne la donnee lue.
  # 10 etait sans effet (aucun outil ne rend plus de 10 lignes) ; 5 aligne le
  # plafond sur ce que l'agent demande reellement et le rend actif ; 3 lirait
  # 12 % de donnees en moins sans perte mesuree, mais couperait l'historique de
  # maintenance a 3 interventions sur 14 — or le contrat de l'outil previent
  # qu'une recidive ne se deduit pas d'un historique tronque. 1 supprimerait la
  # possibilite meme de constater une contradiction entre deux sources (INV-09).
  max_result_rows: 5

execution:
  # Une erreur d'outil arrete l'execution (INV-05). Inerte sur le jeu actuel —
  # les scenarios en erreur attendent de toute facon un refus — mais la valeur
  # tient par principe : continuer apres une erreur, c'est repondre sur une
  # preuve partielle sans le dire.
  stop_on_tool_error: true
  # Le parametre le mieux defendu de la politique : a false, la reussite tombe
  # de 0.833 a 0.556. Six scenarios de refus (SCN-008, 009, 010, 014, 015, 017)
  # basculent en reponses non fondees.
  require_evidence: true
  # Refuse au chargement si mis a false : INV-08 repose dessus, et un drapeau
  # qui ne change rien quand on le desactive n'est pas un controle.
  treat_tool_output_as_data: true
  allow_dynamic_tools: false

trace:
  # Les arguments sont traces par cles et empreinte, jamais en clair : un
  # argument peut transporter une donnee sensible ou une tentative d'exfiltration.
  # L'empreinte est un SHA-256 tronque a 12 caracteres — suffisant pour prouver
  # que deux appels etaient identiques, insuffisant pour relire la valeur.
  # Ces champs sont desormais APPLIQUES : la trace est projetee dessus, et un
  # champ retire ici disparait de la trace sans toucher au code.
  record_fields:
    - step
    - tool
    - argument_keys
    - argument_fingerprint
    - row_count
    - source
    - elapsed_ms
    - outcome
    # Marqueur d'un contenu d'apparence imperative dans un resultat d'outil.
    # Il etait trace sans etre declare : INV-08 s'appuie dessus, il doit etre
    # au contrat.
    - instruction_like_content
  # Verifies a la construction de la trace : leur presence leve, elle ne se
  # contente pas d'etre interdite sur le papier.
  forbidden_fields:
    - document_text
    - raw_arguments
    - private_reasoning
    - personal_data
  # Dette assumee : aucun mecanisme ne purge les traces a 30 jours. Un agent
  # sans stockage ne peut pas le faire seul — c'est au pipeline qui ecrit
  # results/*.jsonl de porter la purge. Voir docs/politique_execution.md, §6.
  retention_days: 30
