# Chaîne de livraison du service de scoring — brief online M5.
#
# Autonome de la chaîne RAG (`diagops-m5-livraison.yml`) : autre artefact, autres dépendances,
# autre image. Les deux ne partagent que le dépôt.
#
# Le fichier est à la racine parce que GitHub ne détecte pas un workflow sous work/M5/online/ —
# même convention qu'en M2 et que pour la chaîne RAG.

name: DiagOps M5 online — scoring

on:
  push:
    paths:
      - "diagops-m5/work/M5/online/**"
      - ".github/workflows/diagops-m5-online.yml"
  pull_request:
    paths:
      - "diagops-m5/work/M5/online/**"
  workflow_dispatch:

# Lecture seule : la chaîne valide un candidat, elle ne promeut rien.
permissions:
  contents: read

defaults:
  run:
    working-directory: diagops-m5/work/M5/online

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  artefact:
    name: Identité de l'artefact et équivalence des features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les versions verrouillées
        # scikit-learn 1.7.1 : la version du gel, jamais une résolution libre. Un joblib chargé
        # sous une autre version est au mieux bruyant, au pire subtilement différent.
        run: python -m pip install --no-cache-dir -r requirements.lock

      - name: Vérifier le checksum de l'artefact
        run: |
          echo "164d05b129ce5e4107cdc27279bc198c  attendu"
          sha256sum artefact/candidat_m4.joblib

      - name: Tests d'artefact, de contrat et d'instrumentation
        # Contient l'équivalence des 19 features avec M4 : une dérive d'extraction rendrait le
        # modèle silencieusement faux — il prédirait bien, sur les mauvaises entrées.
        run: python -m pytest -q

      - name: Résumé
        if: always()
        run: |
          echo '### Service de scoring' >> $GITHUB_STEP_SUMMARY
          echo "- artefact : \`$(sha256sum artefact/candidat_m4.joblib | cut -c1-16)\`" >> $GITHUB_STEP_SUMMARY
          echo "- scikit-learn : $(python -c 'import sklearn; print(sklearn.__version__)')" >> $GITHUB_STEP_SUMMARY

  stack:
    name: Stack conteneurisée et test de fumée
    runs-on: ubuntu-latest
    needs: artefact
    steps:
      - uses: actions/checkout@v4

      - name: Lever la stack
        # --wait rend la livraison bloquante : le healthcheck interroge /health/ready, donc la
        # main n'est rendue que si le modèle est chargé, identifié et conforme.
        run: docker compose -f deploy/compose.yaml up -d --build --wait --wait-timeout 90

      - name: Test de fumée
        run: |
          curl -fsS http://127.0.0.1:8100/health/live
          curl -fsS http://127.0.0.1:8100/health/ready | tee /tmp/ready.json
          grep -q '"sklearn_conforme":true' /tmp/ready.json
          curl -fsS http://127.0.0.1:8100/version
          curl -fsS http://127.0.0.1:8100/metrics | grep -q 'diagops_model_loaded 1'

      - name: Prédiction sur la fenêtre témoin
        # Le contrôle qui compte : la probabilité doit être celle obtenue sur le poste de
        # travail. Un service qui répond n'est pas un service qui répond juste.
        run: |
          python - <<'PY' > /tmp/fenetre.json
          import csv, json
          lignes = list(csv.DictReader(open("../../../data_pack/2026-S1/model_eval/sensor_calibration.csv", encoding="utf-8")))
          fenetre = [l for l in lignes if l["window_id"] == "M4-CAL-001"]
          print(json.dumps({"mesures": [{k: str(m[k]) for k in ("timestamp", "value", "sensor_name", "unit")} for m in fenetre]}))
          PY
          curl -fsS -X POST http://127.0.0.1:8100/predict \
            -H 'Content-Type: application/json' -d @/tmp/fenetre.json | tee /tmp/predit.json
          grep -q '"probabilite_fabriquee":0.114902' /tmp/predit.json
          grep -q '"modele_checksum":"164d05b129ce5e41"' /tmp/predit.json

      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose -f deploy/compose.yaml logs

      - name: Arrêter la stack
        if: always()
        run: docker compose -f deploy/compose.yaml down -v
